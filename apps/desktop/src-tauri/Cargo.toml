[package]
name = "job-application-workspace"
version = "0.1.0"
description = "Private local job application workspace"
authors = ["AmirAli Asadolahzadeh"]
edition = "2021"

[lib]
name = "job_application_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
iota_stronghold = "2.1"
rand = "0.8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-stronghold = "2"
zeroize = "1"
