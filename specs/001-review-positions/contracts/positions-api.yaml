openapi: 3.1.0
info:
  title: Local Positions API
  version: 1.2.0
  description: List, detail, selector, publication-link, rich-description, and approved detail-update contract.
servers:
  - url: /
paths:
  /api/positions:
    get:
      operationId: listPositions
      summary: List row-visible position summaries
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match against title, department, manager, or location.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            oneOf:
              - $ref: "#/components/schemas/PositionStatus"
              - type: string
                const: all
      responses:
        "200":
          description: Positions loaded and validated successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [positions]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PositionSummary"
        "500":
          $ref: "#/components/responses/PositionsDataError"
  /api/positions/{positionId}:
    parameters:
      - name: positionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getPosition
      summary: Get a position for the detail route
      responses:
        "200":
          description: Matching position loaded successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [position]
                properties:
                  position:
                    $ref: "#/components/schemas/Position"
        "404":
          $ref: "#/components/responses/PositionNotFound"
        "500":
          $ref: "#/components/responses/PositionsDataError"
    patch:
      operationId: updatePositionDetails
      summary: Update selectable details, manager, publication links, and formatted description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionDetailsUpdate"
      responses:
        "200":
          description: Details saved and updatedAt assigned by the service.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [position]
                properties:
                  position:
                    $ref: "#/components/schemas/Position"
        "400":
          description: Submitted values are incomplete or inconsistent with reference data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/PositionNotFound"
        "500":
          $ref: "#/components/responses/PositionsWriteError"
  /api/reference-data:
    get:
      operationId: getReferenceData
      summary: Get department, team, and location selector values
      responses:
        "200":
          description: Reference data loaded and validated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceData"
        "500":
          $ref: "#/components/responses/ReferenceDataError"
components:
  responses:
    PositionNotFound:
      description: No position has the requested ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: POSITION_NOT_FOUND
              message: Position not found.
    PositionsDataError:
      description: The local positions file is unavailable or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PositionsWriteError:
      description: The validated position update could not be written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReferenceDataError:
      description: The local reference-data file is unavailable or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    PositionSummary:
      type: object
      additionalProperties: false
      required: [id, company, title, status, workMode, seniority, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        company:
          $ref: "#/components/schemas/Company"
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PositionStatus"
        workMode:
          $ref: "#/components/schemas/WorkMode"
        seniority:
          type: string
          minLength: 1
        updatedAt:
          type: string
          format: date-time
    Position:
      type: object
      additionalProperties: false
      required: [id, company, title, status, workMode, employmentType, seniority, departmentId, teamId, locationId, hiringManager, salary, description, jobPlatformLinks, careerPageUrl, requirements, updatedAt, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        company:
          $ref: "#/components/schemas/Company"
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PositionStatus"
        workMode:
          $ref: "#/components/schemas/WorkMode"
        seniority:
          type: string
          minLength: 1
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        departmentId:
          type: [string, "null"]
        teamId:
          type: [string, "null"]
        locationId:
          type: [string, "null"]
        employmentType:
          oneOf:
            - $ref: "#/components/schemas/EmploymentType"
            - type: "null"
        hiringManager:
          $ref: "#/components/schemas/HiringManager"
        salary:
          oneOf:
            - $ref: "#/components/schemas/Salary"
            - type: "null"
        description:
          $ref: "#/components/schemas/RichTextDocument"
        jobPlatformLinks:
          type: array
          items:
            $ref: "#/components/schemas/JobPlatformLink"
        careerPageUrl:
          type: [string, "null"]
          format: uri
          pattern: '^https?://'
        requirements:
          type: array
          items:
            type: string
    PositionDetailsUpdate:
      type: object
      additionalProperties: false
      required: [departmentId, teamId, locationId, hiringManager, jobPlatformLinks, careerPageUrl, description]
      properties:
        departmentId:
          type: [string, "null"]
        teamId:
          type: [string, "null"]
        locationId:
          type: [string, "null"]
        hiringManager:
          $ref: "#/components/schemas/HiringManager"
        jobPlatformLinks:
          type: array
          items:
            $ref: "#/components/schemas/JobPlatformLink"
        careerPageUrl:
          type: [string, "null"]
          format: uri
          pattern: '^https?://'
        description:
          $ref: "#/components/schemas/RichTextDocument"
    JobPlatformLink:
      type: object
      additionalProperties: false
      required: [platformName, url]
      properties:
        platformName:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: '^https?://'
    RichTextDocument:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RichTextBlockNode"
    RichTextBlockNode:
      oneOf:
        - $ref: "#/components/schemas/ParagraphNode"
        - $ref: "#/components/schemas/HeadingNode"
        - $ref: "#/components/schemas/BulletListNode"
        - $ref: "#/components/schemas/OrderedListNode"
    RichTextInlineNode:
      oneOf:
        - $ref: "#/components/schemas/TextNode"
        - $ref: "#/components/schemas/HardBreakNode"
    ParagraphNode:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: paragraph
        content:
          type: array
          items:
            $ref: "#/components/schemas/RichTextInlineNode"
    HeadingNode:
      type: object
      additionalProperties: false
      required: [type, attrs]
      properties:
        type:
          type: string
          const: heading
        attrs:
          type: object
          additionalProperties: false
          required: [level]
          properties:
            level:
              type: integer
              enum: [1, 2, 3]
        content:
          type: array
          items:
            $ref: "#/components/schemas/RichTextInlineNode"
    BulletListNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: bulletList
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ListItemNode"
    OrderedListNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: orderedList
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ListItemNode"
    ListItemNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: listItem
        content:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/ParagraphNode"
              - $ref: "#/components/schemas/BulletListNode"
              - $ref: "#/components/schemas/OrderedListNode"
    TextNode:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
        marks:
          type: array
          items:
            $ref: "#/components/schemas/RichTextMark"
    HardBreakNode:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: hardBreak
    RichTextMark:
      oneOf:
        - $ref: "#/components/schemas/BoldMark"
        - $ref: "#/components/schemas/ItalicMark"
        - $ref: "#/components/schemas/LinkMark"
    BoldMark:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: bold
    ItalicMark:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: italic
    LinkMark:
      type: object
      additionalProperties: false
      required: [type, attrs]
      properties:
        type:
          type: string
          const: link
        attrs:
          type: object
          additionalProperties: false
          required: [href]
          properties:
            href:
              type: string
              format: uri
              pattern: '^https?://'
    ReferenceData:
      type: object
      additionalProperties: false
      required: [version, departments, locations]
      properties:
        version:
          type: integer
          const: 1
        departments:
          type: array
          items:
            $ref: "#/components/schemas/Department"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    Department:
      type: object
      additionalProperties: false
      required: [id, name, teams]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
    Team:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    Location:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    Company:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        logoPath:
          type: [string, "null"]
          pattern: '^/company-logos/[^/\\]+$'
    HiringManager:
      type: object
      additionalProperties: false
      required: [name, phone, position]
      properties:
        name:
          type: string
        phone:
          type: string
        position:
          type: string
    Salary:
      type: object
      additionalProperties: false
      required: [min, max, currency]
      properties:
        min:
          type: number
          minimum: 0
        max:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    PositionStatus:
      type: string
      enum: [draft, open, interviewing, on_hold, closed]
    WorkMode:
      type: string
      enum: [remote, hybrid, onsite]
    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, internship]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - POSITIONS_DATA_UNAVAILABLE
                - POSITIONS_DATA_INVALID
                - REFERENCE_DATA_UNAVAILABLE
                - REFERENCE_DATA_INVALID
                - POSITION_UPDATE_INVALID
                - POSITION_NOT_FOUND
                - POSITION_WRITE_FAILED
            message:
              type: string
              minLength: 1
