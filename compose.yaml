services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - workspace-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workspace
      MINIO_ROOT_PASSWORD: workspace-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - workspace-objects:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  workspace-postgres:
  workspace-objects:
